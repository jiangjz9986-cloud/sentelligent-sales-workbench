name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source, backend, and frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHROME_PATH: /usr/bin/google-chrome

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            outputs/product-design-prototype/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix outputs/product-design-prototype

      - name: Install WebKit browser
        working-directory: outputs/product-design-prototype
        run: npx playwright install --with-deps webkit

      - name: Scan current source for secrets
        run: npm run scan:secrets

      - name: Verify release tooling
        run: node --test scripts/*.test.mjs

      - name: Test backend
        run: npm --prefix backend test

      - name: Build and test frontend
        run: npm --prefix outputs/product-design-prototype run qa:local

      - name: Run browser integration QA
        run: npm --prefix outputs/product-design-prototype run qa:integration

      - name: Run WebKit Safari-equivalence QA
        run: npm --prefix outputs/product-design-prototype run qa:webkit
